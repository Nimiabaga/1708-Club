<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Food — 1708 Hotel</title>
  <!-- use relative paths so it works via file:// -->
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

  <style>
    /* Banner styling */
    .menu-banner{
      position: relative;
      padding: 1.6rem 0 1.05rem 0;
      margin: .4rem 0 .9rem;
      background: linear-gradient(180deg,#111 0%, #000 60%, #000 100%);
      border: 1.5px solid #2cc440;
      border-radius: 7px;
      box-shadow:
        0 5px 24px 0 #00000050,
        0 1px 0 #000000,
        0 0 24px 0 #00000060;
      text-align: center;
    }
    .menu-banner .super-glow{
      position: absolute; inset:0; pointer-events: none; z-index:0;
      background: radial-gradient(50% 80% at 50% 70%, rgba(0,0,0,.35) 0%, rgba(212,175,55,0) 90%);
      opacity: 1;
    }
    .menu-banner h2{
      position: relative; z-index:1; margin:0;
      letter-spacing:.14em;
      text-transform:uppercase;
      font-weight: 900;
      font-size: 2rem;
      background: linear-gradient(180deg,#fffde0 0%, #2cc440 25%, #2cc440 65%, #2cc440 95%, #fff7cc 100%);
      -webkit-background-clip:text; background-clip:text;
      -webkit-text-fill-color:transparent;
      -webkit-text-stroke: 2px #d4af3766;
      filter: drop-shadow(0 3px 12px #201600) drop-shadow(0 0 16px #ffedb366);
      text-shadow: 0 2px 18px #b8921c44;
    }
    .menu-banner h2::after{
      content:""; display:block; width:150px; height:2.5px; margin:.7rem auto 0;
      border-radius:2px; background: linear-gradient(90deg, transparent, #2cc440, transparent);
      box-shadow: 0 0 18px #d4af3748;
    }

    /* Category toggle buttons */
    .menu-toggle{
      display:flex;justify-content:center;gap:.6rem;flex-wrap:wrap;
      margin:.85rem auto 0;max-width:980px;padding:0 .8rem;
    }
    .menu-toggle a{
      display:inline-block; text-decoration:none; font-weight:800; letter-spacing:.2px;
      padding:.55rem 1rem; border-radius:8px; border:1.5px solid #2cc440; color:#2a1e00;
      background: linear-gradient(180deg, #2cc440 0%, #2cc440 58%, #2cc440 100%);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.25), 0 2px 0 #8f6f05, 0 10px 24px rgba(212,175,55,.28);
      position:relative; isolation:isolate; transition: transform .12s ease, box-shadow .18s ease;
    }
    .menu-toggle a::before{
      content:""; position:absolute; left:10px; right:10px; top:7px; height:38%;
      border-radius:12px; background:linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,0));
      pointer-events:none;
    }
    .menu-toggle a:hover, .menu-toggle a:focus-visible{ transform: translateY(-1px); outline:none; }

    /* Sold-out visuals */
    .soldout-label{
      color:#fff; background:#d91e1e; border-radius:.35em; padding:.07em .5em;
      font-weight:700; margin-left:.6em; font-size:.97em; vertical-align:middle; display:inline-block;
    }
    .food-card.soldout{ opacity:.48; }

    /* Extra space past fixed nav */
    main{ padding-bottom: 4.5rem; }
  </style>
</head>
<body>
  <!-- Header (logo only) -->
  <header class="animate__animated animate__fadeInDown">
    <img src="images/1708.png" alt="1708 Hotel Logo" class="logo" />
  </header>

  <!-- Banner -->
  <div class="menu-banner">
    <span class="super-glow" aria-hidden="true"></span>
    <h2>FOOD</h2>
  </div>

  <!-- Category Buttons -->
  <div class="menu-toggle">
    <a href="./appetizers-nat.html">Appetizers (National)</a>
    <a href="./appetizers-int.html">Appetizers (Inter.)</a>
    <a href="./main-dishes-nat.html">Main Dishes Nat. (Rice)</a>
    <a href="./main-dishes-int.html">Main Dishes Inter. (Pasta)</a>
    <a href="./swallows.html">Swallows</a>
    <a href="./national-soups.html">National Soups</a>
    <a href="./bbq-fries.html">BBQ-Fries</a>
    <a href="./stews-sauces.html">Stews &amp; Sauces</a>
    <a href="./breakfast-dishes.html">Breakfast Dishes</a>
    <a href="./beverages.html">Beverages</a>
    <a href="./proteins.html">Proteins</a>
  </div>

  <!-- Preview Grid -->
  <main>
    <div class="food-grid">
      <div class="food-card" id="card-afang-soup">
        <img src="images/afang-soup.jpg" alt="Afang Soup" />
        <div class="food-info"><h4>Afang Soup</h4><p id="price-afang-soup"></p></div>
      </div>
      <div class="food-card" id="card-club-sandwich">
        <img src="images/club-sandwich.jpg" alt="Club Sandwich" />
        <div class="food-info"><h4>Club Sandwich</h4><p id="price-club-sandwich"></p></div>
      </div>
      <div class="food-card" id="card-french-fries">
        <img src="images/french-fries.jpg" alt="French Fries" />
        <div class="food-info"><h4>French Fries</h4><p id="price-french-fries"></p></div>
      </div>
      <div class="food-card" id="card-chicken-wings">
        <img src="images/chicken-wings.jpg" alt="Chicken Wings" />
        <div class="food-info"><h4>Chicken Wings</h4><p id="price-chicken-wings"></p></div>
      </div>
    </div>

    <div class="tray-note">Takeout ₦300</div>
  </main>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <a href="./index.html">Home</a>
    <a href="./food.html" class="active">Food</a>
    <a href="./drinks.html">Drinks</a>
    <a href="./rooms.html">Rooms</a>
    <a href="./contact.html">Contact</a>
  </nav>

  <!-- Data injection -->
  <script>
    const ENDPOINT = 'https://script.google.com/macros/s/AKfycbwnziA_6JOOFhaY4yf81_z8TDi-g3ETkW8yLcC4Tw3IEXDAE2jQ_2WwIS8FVA17Fmk/exec';
    const TOKEN    = 'Forgive1988@';

    function formatNaira(amount) {
      if(amount==null || amount==='' || isNaN(amount)) return '₦0';
      return '₦' + Number(amount).toLocaleString();
    }
    function slug(s){
      return String(s)
        .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9]/gi,'-')
        .replace(/-+/g,'-')
        .toLowerCase()
        .replace(/-$/,'');
    }
    function injectFood() {
      fetch(`${ENDPOINT}?token=${encodeURIComponent(TOKEN)}`)
        .then(res => res.json())
        .then(result => {
          if(!result.ok || !Array.isArray(result.rows)) return;

          result.rows.forEach(item => {
            if (String(item.type) !== 'Food') return;
            if (!item.name) return;

            const priceEl = document.getElementById('price-' + slug(item.name));
            const cardEl  = priceEl ? priceEl.closest('.food-card') : null;
            if(!priceEl || !cardEl) return;

            priceEl.innerHTML = '';
            cardEl.classList.remove('soldout');

            const available = (item.available === true) || (String(item.available).toLowerCase()==='true');
            if (available) {
              priceEl.textContent = formatNaira(item.price);
            } else {
              priceEl.innerHTML = `${formatNaira(item.price)} <span class="soldout-label">Sold Out</span>`;
              cardEl.classList.add('soldout');
            }
          });
        })
        .catch(()=>{ /* ignore network errors for now */ });
    }

    document.addEventListener('DOMContentLoaded', injectFood);
    setInterval(injectFood, 30000);
  </script>
</body>
</html>
