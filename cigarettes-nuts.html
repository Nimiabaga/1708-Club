<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cigarettes / Nuts — 1708 Hotel</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

  <style>
    /* Banner styling */
    .menu-banner{
      position: relative;
      padding: 1.6rem 0 1.05rem 0;
      margin: .4rem 0 .9rem;
      background: linear-gradient(180deg,#111 0%, #000 60%, #000 100%);
      border: 1.5px solid #2cc440;
      border-radius: 7px;
      box-shadow:
        0 5px 24px 0 #00000050,
        0 1px 0 #000000,
        0 0 24px 0 #00000060;
      text-align: center;
    }
    .menu-banner .super-glow{
      position: absolute; inset:0; pointer-events: none; z-index:0;
      background: radial-gradient(50% 80% at 50% 70%, rgba(0,0,0,.35) 0%, rgba(212,175,55,0) 90%);
      opacity: 1;
    }
    .menu-banner h2{
      position: relative; z-index:1; margin:0;
      letter-spacing:.14em;
      text-transform:uppercase;
      font-weight: 900;
      font-size: 2rem;
      background: linear-gradient(180deg,#fffde0 0%, #2cc440 25%, #2cc440 65%, #2cc440 95%, #fff7cc 100%);
      -webkit-background-clip:text; background-clip:text;
      -webkit-text-fill-color:transparent;
      -webkit-text-stroke: 2px #d4af3766;
      filter: drop-shadow(0 3px 12px #201600) drop-shadow(0 0 16px #ffedb366);
      text-shadow: 0 2px 18px #b8921c44;
    }
    .menu-banner h2::after{
      content:""; display:block; width:150px; height:2.5px; margin:.7rem auto 0;
      border-radius:2px; background: linear-gradient(90deg, transparent, #2cc440, transparent);
      box-shadow: 0 0 18px #d4af3748;
    }

    /* Back button */
    .back-wrap{ display:flex; justify-content:center; margin:.85rem auto 0; padding:0 .8rem; max-width:980px; }
    .back-btn{
      display:inline-block; text-decoration:none; font-weight:800; letter-spacing:.2px;
      padding:.65rem 1.05rem; border-radius:14px; border:1.5px solid #2cc440; color:#2a1e00;
      background: linear-gradient(180deg, #2cc440 0%, #2cc440 58%, #2cc440 100%);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.25), 0 2px 0 #8f6f05, 0 10px 24px rgba(212,175,55,.28);
      position:relative; isolation:isolate; transition: transform .12s ease, box-shadow .18s ease;
    }
    .back-btn::before{
      content:""; position:absolute; left:10px; right:10px; top:7px; height:38%;
      border-radius:12px; background:linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,0));
      pointer-events:none;
    }
    .back-btn:hover, .back-btn:focus-visible{ transform: translateY(-1px); outline:none; }

    /* Hero drink image */
    .hero-drink{
      max-width: 980px;
      margin: 1.2rem auto;
      padding: 0 1rem;
    }
    .hero-drink img{
      width: 100%;
      max-height: 380px;
      object-fit: cover;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(44,196,64,.22);
      border: 1px solid #2cc440;
    }

    /* Single card for accessories */
    .single-card{
      max-width: 980px;
      margin: 1rem auto;
      padding: 0 1rem;
    }

    /* List styling */
    .list-wrap{
      max-width: 980px;
      margin: 1rem auto 0;
      padding: 0 1rem;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1rem;
      padding-bottom: 5rem;
    }
    .list-card{
      background:#151515;
      border:1px solid #2cc440;
      border-radius:16px;
      box-shadow: 0 10px 28px rgba(44,196,64,.15);
      overflow:hidden;
    }
    .list-card h3{
      margin:.8rem 0 .2rem; text-align:center; font-size:1rem; color:#2cc440; letter-spacing:.05em;
    }
    .item-list{ list-style:none; margin:.2rem 0 0; padding:.2rem .8rem 1rem; }
    .item-list li{
      display:flex; justify-content:space-between; align-items:center;
      padding:.6rem .6rem;
      border-bottom:1px dashed rgba(44,196,64,.25);
      font-weight:700; color:#eee; letter-spacing:.2px;
    }
    .item-list li:last-child{ border-bottom:0; }
    .price{
      color:#2cc440;
      font-weight:900;
      margin-left:.8rem;
      white-space:nowrap;
    }
    
    /* Sold-out visuals */
    .soldout-label{
      color:#fff; background:#d91e1e; border-radius:.35em; padding:.07em .5em;
      font-weight:700; margin-left:.6em; font-size:.92em; vertical-align:middle; display:inline-block;
    }
    li.soldout{ opacity:.48; }

    /* Extra space past fixed nav */
    main{ padding-bottom: 4.5rem; }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="animate__animated animate__fadeInDown">
    <img src="images/1708.png" alt="1708 Hotel Logo" class="logo" />
  </header>

  <!-- Banner -->
  <div class="menu-banner">
    <span class="super-glow" aria-hidden="true"></span>
    <h2>CIGARETTES / NUTS</h2>
  </div>

  <!-- Back to Drinks -->
  <div class="back-wrap">
    <a class="back-btn" href="./drinks.html">← Back to Drinks</a>
  </div>

  <!-- Optional single top image -->
  <div class="hero-drink">
    <img src="images/cigs-nuts.jpg" alt="Cigarettes and Nuts" />
  </div>

  <!-- Lighter (full-width single card) -->
  <div class="single-card">
    <section class="list-card" aria-label="Accessories">
      <h3>Accessories</h3>
      <ul class="item-list">
        <li id="item-lighter"><span>LIGHTER</span><span class="price" id="price-lighter"></span></li>
      </ul>
    </section>
  </div>

  <!-- Two-column lists -->
  <main>
    <div class="list-wrap">
      <!-- Column 1 -->
      <section class="list-card">
        <h3>Cigarettes</h3>
        <ul class="item-list">
          <li id="item-dunhill"><span>DUNHILL</span><span class="price" id="price-dunhill"></span></li>
          <li id="item-benson-switch"><span>BENSON SWITCH</span><span class="price" id="price-benson-switch"></span></li>
          <li id="item-benson-boost"><span>BENSON BOOST</span><span class="price" id="price-benson-boost"></span></li>
          <li id="item-benson"><span>BENSON</span><span class="price" id="price-benson"></span></li>
          <li id="item-esse-change"><span>ESSE CHANGE</span><span class="price" id="price-esse-change"></span></li>
        </ul>
      </section>

      <!-- Column 2 -->
      <section class="list-card">
        <h3>More Cigarettes / Nuts</h3>
        <ul class="item-list">
          <li id="item-oris"><span>ORIS</span><span class="price" id="price-oris"></span></li>
          <li id="item-chesterfield"><span>CHESTERFIELD</span><span class="price" id="price-chesterfield"></span></li>
          <li id="item-dorchester"><span>DORCHESTER</span><span class="price" id="price-dorchester"></span></li>
          <li id="item-bohem"><span>BOHEM</span><span class="price" id="price-bohem"></span></li>
          <li id="item-groundnut-small"><span>GROUNDNUT SMALL</span><span class="price" id="price-groundnut-small"></span></li>
          <li id="item-groundnut-big"><span>GROUNDNUT BIG</span><span class="price" id="price-groundnut-big"></span></li>
        </ul>
      </section>
    </div>
  </main>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <a href="./index.html">Home</a>
    <a href="./food.html">Food</a>
    <a href="./drinks.html" class="active">Drinks</a>
    <a href="./rooms.html">Rooms</a>
    <a href="./contact.html">Contact</a>
  </nav>

  <!-- Data injection -->
  <script>
    const ENDPOINT = 'https://script.google.com/macros/s/AKfycbwnziA_6JOOFhaY4yf81_z8TDi-g3ETkW8yLcC4Tw3IEXDAE2jQ_2WwIS8FVA17Fmk/exec';
    const TOKEN = 'Forgive1988@';
    const formatNaira = n => '₦' + Number(n||0).toLocaleString();
    const slug = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/gi,'-').replace(/-+/g,'-').toLowerCase().replace(/-$/,'');

    function injectCigarettesNuts(){
      fetch(`${ENDPOINT}?token=${encodeURIComponent(TOKEN)}`)
        .then(r=>r.json())
        .then(j=>{
          if(!j.ok || !Array.isArray(j.rows)) return;
          j.rows.forEach(item=>{
            if (String(item.type) !== 'Drinks') return;
            if (String(item.cat) !== 'Cigarettes / Nuts') return;
            if (!item.name) return;
            const priceEl = document.getElementById('price-' + slug(item.name));
            const itemEl = document.getElementById('item-' + slug(item.name));
            if (!priceEl) return;
            priceEl.innerHTML = '';
            if (itemEl) itemEl.classList.remove('soldout');
            const available = (item.available === true) || (String(item.available).toLowerCase() === 'true');
            if (available) {
              priceEl.textContent = formatNaira(item.price);
            } else {
              priceEl.innerHTML = `${formatNaira(item.price)} <span class="soldout-label">Sold Out</span>`;
              if (itemEl) itemEl.classList.add('soldout');
            }
          });
        }).catch(()=>{});
    }

    document.addEventListener('DOMContentLoaded', injectCigarettesNuts);
    setInterval(injectCigarettesNuts, 30000);
  </script>
</body>
</html>
